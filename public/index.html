<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />

    <!-- TITLE AND DESCRIPTION
         These are what LinkedIn, WhatsApp and Google show BEFORE anyone clicks. The previous version
         still carried the template's own text ("DeveloperFolio | Developer Portfolio Template"), so
         every shared link advertised the template instead of the person. -->
    <title>Nur Ariff — DevOps &amp; Platform Engineer</title>
    <meta
      name="description"
      content="DevOps engineer in Malaysia building a self-hosted Kubernetes platform: GitOps with Argo CD, centralised identity, sealed secrets, and a disaster recovery procedure that has actually been tested."
    />
    <meta name="author" content="Nur Ariff Zubaidi" />

    <!-- Open Graph: the card that renders when the link is shared -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nur Ariff — DevOps &amp; Platform Engineer" />
    <meta
      property="og:description"
      content="A homelab platform run like production: 22 Argo CD applications, Keycloak SSO across three systems, secrets sealed in git, and a tested recovery path."
    />
    <meta property="og:url" content="https://areppzubaidi.github.io/Professional-Website/" />
    <meta property="og:site_name" content="Nur Ariff" />
    <meta property="og:image" content="https://areppzubaidi.github.io/Professional-Website/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nur Ariff - DevOps and Platform Engineer" />
    <meta property="og:locale" content="en_MY" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nur Ariff — DevOps &amp; Platform Engineer" />
    <meta
      name="twitter:description"
      content="Platform engineering by building one: GitOps, SSO, sealed secrets, tested disaster recovery."
    />

    <meta name="twitter:image" content="https://areppzubaidi.github.io/Professional-Website/og-image.png" />
    <link rel="canonical" href="https://areppzubaidi.github.io/Professional-Website/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Set the colour scheme early so the splash screen does not flash white in dark mode -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("isDark");
          if (stored === "true") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nur Ariff Zubaidi",
        "jobTitle": "DevOps Engineer",
        "worksFor": { "@type": "Organization", "name": "ARRK Engineering" },
        "url": "https://areppzubaidi.github.io/Professional-Website/",
        "image": "https://areppzubaidi.github.io/Professional-Website/og-image.png",
        "address": { "@type": "PostalAddress", "addressCountry": "MY" },
        "knowsAbout": ["Kubernetes", "GitOps", "Argo CD", "Terraform", "Linux", "CI/CD"],
        "sameAs": ["https://github.com/areppzubaidi",
                   "https://www.linkedin.com/in/nur-ariff-zubaidi-045785103/"]
      }
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript — it is a React application.</noscript>
    <div id="root"></div>
  </body>
</html>
